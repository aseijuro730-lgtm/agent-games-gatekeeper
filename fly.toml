# Fly.io deploy config. Set the app name on first deploy:
#   fly launch --no-deploy (then fly deploy), or edit `app` below.
app = "arthurandwho-gatekeeper"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8787"
